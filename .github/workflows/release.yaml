# Publishes the release a tag names to PyPI (datalayer-skills), with no stored
# token: PyPI trusts this workflow file (OIDC trusted publishing, through the
# `pypi` environment). The tag must name the version in
# datalayer_skills/__version__.py; a version already published is skipped.
# Nothing is built before the tests (py-tests.yaml, called here) pass on the
# tagged commit.

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/py-tests.yaml

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.plan.outputs.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag names the version the package carries
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import re;print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)', open('datalayer_skills/__version__.py').read())[1])")"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Find whether it is published yet
        id: plan
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status="$(curl -sL -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/datalayer-skills/$version/json")"
          if [ "$status" = "200" ]; then
            echo "PyPI: datalayer-skills $version is already published, skipping"
            echo "python=" >> "$GITHUB_OUTPUT"
          else
            echo "PyPI: datalayer-skills $version will be published"
            echo "python=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.plan.outputs.python != ''
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist .
          ls -la dist

      - name: Check the wheel carries every skill's SKILL.md and scripts
        if: steps.plan.outputs.python != ''
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          listing="$(unzip -l "$wheel")"
          for skill in whoami memory_add memory_search memory_list memory_delete accounting crawl events github image pdf text_summarizer video; do
            grep -q "datalayer_skills/skills/$skill/SKILL.md" <<<"$listing"
            grep -q "datalayer_skills/skills/$skill/scripts/" <<<"$listing"
          done
          grep -q "datalayer_skills/skills/pdf/LICENSE.txt" <<<"$listing"
          grep -q "datalayer_skills/skills/video/scripts/zoom_video.py" <<<"$listing"
          unzip -p "$wheel" '*.dist-info/entry_points.txt'

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.python != ''
        with:
          name: python
          path: dist/*

  pypi:
    needs: build
    if: needs.build.outputs.python != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: GitHub release
    needs: [build, pypi]
    if: always() && needs.build.result == 'success' && needs.pypi.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release with generated notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --title "Release $version" --generate-notes \
            --notes "- [PyPI datalayer-skills](https://pypi.org/project/datalayer-skills/$version/)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
