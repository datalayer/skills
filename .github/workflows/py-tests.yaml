name: Py Tests

# The package's tests on every supported Python, and ruff. No secrets: the
# memory skills run against a fake agent runtime on the loopback, the
# accounting scripts on small books, the video zoom on a generated clip.

on:
  push:
    branches:
      - main
    paths:
      - 'datalayer_skills/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/py-tests.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'datalayer_skills/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/py-tests.yaml'

  workflow_dispatch:

  # Called by the Release workflow: a tag publishes nothing until these pass.
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install
        run: uv pip install ".[test]"

      - name: Run tests
        run: pytest tests/ -q

  code-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: '3.12'
          activate-environment: true

      - name: Ruff
        run: |
          uv pip install ruff
          ruff check .
          ruff format --check .
